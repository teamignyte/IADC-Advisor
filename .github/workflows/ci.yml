name: CI

on:
  push:
  pull_request:

# Narrower than the family reference workflow (IADC-Graph-Plugin's ci.yml), which declares no
# permissions block and no persist-credentials override: this repo's default GITHUB_TOKEN scope
# is already read (IV-402), and both lines pin that in the file rather than leaving it dependent
# on a repository setting that can be changed without a commit — deliberate defence-in-depth,
# not drift to be synced away.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python3 -m pytest -v
